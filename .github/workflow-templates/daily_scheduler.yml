name: Daily Arxiv Fetcher

on:
  schedule:
    # 每天 UTC 1:25 (北京时间 9:25) 运行
    - cron: '25 1 * * *'
  workflow_dispatch:
    inputs:
      rate_limit_retry:
        description: '429 限流后的自动重试标记'
        required: false
        default: '0'

permissions:
  contents: write
  actions: write

concurrency:
  group: arxiv-database-writer
  queue: max

jobs:
  fetch-papers:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Fetch and Update Inbox
        id: fetch
        run: |
          set +e
          python scripts/fetch_arxiv.py
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 75 ]; then
            echo "rate_limited=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$exit_code"

      - name: Retry workflow after rate limit
        if: steps.fetch.outputs.rate_limited == 'true' && github.event.inputs.rate_limit_retry != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ARXIV_COOLDOWN: ${{ steps.fetch.outputs.retry_after_seconds }}
        run: |
          echo "请求重试耗尽且出现 HTTP 429，按冷却时间重新启动工作流"
          cooldown="${ARXIV_COOLDOWN:-300}"
          if ! [[ "$cooldown" =~ ^[0-9]{1,6}$ ]]; then exit 1; fi
          if [ "$cooldown" -gt 900 ]; then
            echo "服务端要求冷却 ${cooldown} 秒，不提前重试；请冷却后手动运行"
            exit 75
          fi
          echo "等待 ${cooldown} 秒后重启"
          sleep "$cooldown"
          gh workflow run daily_scheduler.yml --ref main -f rate_limit_retry=1

      - name: Stop after repeated rate limit
        if: steps.fetch.outputs.rate_limited == 'true' && github.event.inputs.rate_limit_retry == '1'
        run: |
          echo "自动重启后仍发生限流相关失败，停止并标记失败，不再自动重启"
          exit 75

      - name: Commit and Push changes
        if: steps.fetch.outputs.rate_limited != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Inbox.md data/arxiv.db
          if git diff --cached --quiet; then
            echo "没有需要提交的更新"
            exit 0
          fi
          git commit -m "🤖 自动更新论文 $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
