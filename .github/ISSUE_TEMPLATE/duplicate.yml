name: 重复问题 / Duplicate
description: 相同的 Issue 或 PR 已存在 / This issue or pull request already exists
title: "[Duplicate]: "
labels: [duplicate]
body:
  - type: input
    id: existing
    attributes:
      label: 已有 Issue 或 PR / Existing issue or pull request
      description: 请粘贴重复内容的链接。/ Link to the existing duplicate.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 重复原因 / Why it is a duplicate
    validations:
      required: true
