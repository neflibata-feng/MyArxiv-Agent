name: 功能建议 / Enhancement
description: 新功能或改进请求 / New feature or request
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to solve
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
