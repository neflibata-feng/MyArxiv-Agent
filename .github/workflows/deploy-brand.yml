name: Deploy brand site
on:
  push:
    branches: [brand-site]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: brand-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'neflibata-feng/MyArxiv-Agent'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-site
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -f CNAME ]; then cp CNAME _site/; fi
          if [ -d site-assets ]; then cp -R site-assets _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
