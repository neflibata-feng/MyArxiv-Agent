name: Deploy brand site
on:
  push:
    branches: [main, codex/brand-site]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: brand-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'neflibata-feng/MyArxiv-Agent'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/brand-site
      - name: Prepare site
        run: mkdir -p _site && cp index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
